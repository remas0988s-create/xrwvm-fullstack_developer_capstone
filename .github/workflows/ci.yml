name: Cars Dealership CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install -r server/requirements.txt -r server/djangoapp/microservices/requirements.txt
          npm ci --prefix server/database
      - name: Verify Django configuration and tests
        working-directory: server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Build React frontend
        run: |
          npm ci --prefix server/frontend
          npm run build --prefix server/frontend
      - name: Test Express and sentiment endpoints
        run: |
          INTERNAL_TOKEN=ci-local-only LOCAL_REVIEW_FILE=/tmp/ci-reviews.json node server/database/app.js &
          python server/djangoapp/microservices/app.py &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:3030/fetchDealers/Kansas | python -c 'import json,sys; d=json.load(sys.stdin); assert d and all(x["state"]=="Kansas" for x in d)'
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent 'http://127.0.0.1:5050/analyze/Fantastic%20services' | python -c 'import json,sys; assert json.load(sys.stdin)["sentiment"]=="positive"'
      - name: Verify integrated application in Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/capstone-evidence"
          export EVIDENCE_DIR="$RUNNER_TEMP/capstone-evidence"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/browsers"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          export INTERNAL_TOKEN=ci-local-only LOCAL_REVIEW_FILE="$RUNNER_TEMP/reviews.json" DJANGO_DB_PATH="$RUNNER_TEMP/cars.sqlite3"
          node server/database/app.js &
          python server/djangoapp/microservices/app.py &
          cd server
          python manage.py migrate --noinput
          python manage.py seed_cars
          DJANGO_SUPERUSER_PASSWORD='Capstone-local-only-179!' python manage.py createsuperuser --noinput --username root --email root@example.invalid
          python manage.py runserver 127.0.0.1:8085 --noreload &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8085/djangoapp/get_dealers >/dev/null
          node verification/browser.cjs | tee "$EVIDENCE_DIR/browser_checks.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/capstone-evidence/
